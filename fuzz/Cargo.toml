[package]
name = "rulite-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Not part of the rulite package: built only by `cargo fuzz`.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "build_read"
path = "fuzz_targets/build_read.rs"
test = false
doc = false
bench = false
